[package]
name = "imiev-capture"
version = "0.1.0"
edition = "2024"

[features]
default = ["cli"]
# The command-line tool and its libusb transport. The library builds without it
# for Android and wasm32.
cli = ["obd-adapter/usb", "dep:ctrlc", "dep:pollster", "dep:clap"]

[[bin]]
name = "imiev-capture"
required-features = ["cli"]

[dependencies]
automotive_diag = { version = "0.1", default-features = false, features = ["kwp2000"] }
embedded-can = "0.4"
obd-adapter = { path = "../obd-adapter" }
ctrlc = { version = "3", optional = true }
pollster = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
pollster = "1"
